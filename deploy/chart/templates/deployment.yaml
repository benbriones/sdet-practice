# Goal: Run the app with health probes, a zero-downtime rollout and a non-root user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sdet-cicd-lab
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  # A new pod must be Ready before an old one stops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdet-cicd-lab
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdet-cicd-lab
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          # Tags are immutable SHAs, so a cached copy is always the right one
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # APP_COMMIT_SHA comes from the image, so a chart value can't misreport it
          env:
            - name: APP_ENVIRONMENT
              value: {{ .Values.environment | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # Liveness restarts the container, so it fires slower than readiness
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # No CPU limit, so the app isn't throttled under load
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # The image's USER is a name, so Kubernetes needs the numeric uid to verify it
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
