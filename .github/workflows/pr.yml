name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Test the commit you pushed, not GitHub's temporary merge commit
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      # BASE_URL is unset, so Playwright builds and starts the app itself
      - run: npm run test:e2e

      # Upload after failures too, but skip runs that were cancelled
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Job-level permissions replace the workflow default, so list both
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      # GHCR rejects capital letters in image names
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published tag never changes, so skip the build if this SHA was already pushed
      - id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:$SHA" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:$SHA already exists, skipping build"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # QEMU lets the amd64 runner build the arm64 image
      - uses: docker/setup-qemu-action@v4
        if: steps.exists.outputs.found != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.found != 'true'

      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.found != 'true'
        with:
          # Build the checked-out files; the default fetches the merge commit instead
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          build-args: COMMIT_SHA=${{ env.SHA }}
          # Links the GHCR package to this repo
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
